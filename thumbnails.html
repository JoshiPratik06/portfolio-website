<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thumbnail Gallery | Pratik Joshi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page">
  <nav class="navbar" aria-label="Primary navigation">
    <div class="nav-container">
      <a href="index.html#home" class="nav-logo" aria-label="Pratik Joshi, home">PJ<span>.</span></a>
      <div class="nav-menu" id="nav-menu">
        <a href="index.html#projects" class="nav-link">Projects</a>
        <a href="index.html#about" class="nav-link">About</a>
      </div>
      <a href="index.html#contact" class="nav-contact">Let's talk <i data-lucide="arrow-up-right"></i></a>
      <button class="hamburger" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-menu"><span></span><span></span></button>
    </div>
  </nav>

  <main>
    <section class="gallery-header">
      <div class="container">
        <p class="eyebrow"><span></span> Thumbnail gallery</p>
        <h1>All my YouTube thumbnails in one place.</h1>
        <p class="hero-subtitle">Browse the full collection of visuals that represent the channel’s style and personality.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="gallery-grid" class="gallery-grid"></div>
      </div>
    </section>
  </main>

  <div id="lightbox-overlay" class="lightbox-overlay" aria-hidden="true">
    <button id="lightbox-close" class="lightbox-close" aria-label="Close image">×</button>
    <div class="lightbox-content">
      <img id="lightbox-image" src="" alt="Expanded thumbnail">
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
